name = "erdos963"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["E963", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Mathlib v4.36.0, pinned to the exact commit
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "E963"

# Palomar / `lake comparator` layout: `Challenge.lean` is the statement, `Solution.lean` the proof.
[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
